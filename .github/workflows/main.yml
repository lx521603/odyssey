name: 🚀 Deploy to GitHub Pages

on:
  # 当代码推送到 main 分支时触发
  push:
    branches: main
  # 也可以手动触发
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    # 启用必要的权限
    permissions:
      contents: write # 写入仓库内容（用于 gh-pages 分支）
      pages: write    # 写入 Pages 配置
      id-token: write # 用于 OIDC 身份验证

    steps:
      - name: 1. Clone repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 3. Install dependencies
        run: npm install

      - name: 4. Build project
        # 运行您的构建命令，产物在 dist 目录
        run: npm run build

      - name: 5. Setup Pages
        # 配置 GitHub Pages 环境
        uses: actions/configure-pages@v5

      - name: 6. Upload artifact
        # 将构建产物 (dist 目录) 上传为 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 您的构建输出目录

      - name: 7. Deploy to GitHub Pages 🚀
        # 实际触发部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
